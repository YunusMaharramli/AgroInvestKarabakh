name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build API
        run: dotnet build src/QarabagInvestmentPortal.Api -c Release
      - name: Unit tests
        run: dotnet test tests/QarabagInvestmentPortal.UnitTests -c Release
      - name: Architecture tests
        run: dotnet test tests/QarabagInvestmentPortal.ArchitectureTests -c Release
      # PostgreSQL integration tests need a database server and run locally.

  frontend:
    name: Build frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run lint
      - run: npm run build
